document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ackground:transparent;color:#191817;border:1px solid #191817;border-radius:4px;font-size:12.5px;font-weight:500;letter-spacing:0.02em;cursor:pointer;\" style-hover=\"background:#191817;color:#F7F5F0;\">Import sheet</button>\n    <button onclick=\"{{ openAdd }}\" style=\"display:inline-flex;align-items:center;gap:7px;padding:10px 18px;background:#191817;color:#F7F5F0;border:1px solid #191817;border-radius:4px;font-size:12.5px;font-weight:500;letter-spacing:0.02em;cursor:pointer;\" style-hover=\"background:#FFC45C;color:#191817;border-color:#FFC45C;\"><span style=\"font-size:15px;line-height:0;\">+</span> Add post</button>\n  </header>\n\n  <!-- ── LEGEND / FILTER BAR ─────────────────────────── -->\n  <div style=\"display:flex;align-items:center;gap:18px;padding:9px 26px;background:#FFFFFF;border-bottom:1px solid #E1DCD0;flex-shrink:0;flex-wrap:wrap;\">\n    <span style=\"font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#95918A;font-weight:500;\">Content type</span>\n    <div style=\"display:flex;align-items:center;gap:7px;\">\n      <sc-for list=\"{{ typeLegend }}\" as=\"lg\" hint-placeholder-count=\"4\">\n        <button onclick=\"{{ lg.click }}\" title=\"{{ lg.title }}\" style=\"{{ lg.style }}\">\n          <span style=\"{{ lg.swatch }}\"></span>{{ lg.label }}\n        </button>\n      </sc-for>\n    </div>\n    <div style=\"width:1px;height:20px;background:#E1DCD0;\"></div>\n    <span style=\"font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:#95918A;font-weight:500;\">Status</span>\n    <select onchange=\"{{ onStatusFilter }}\" value=\"{{ filterStatus }}\" style=\"border:none;border-bottom:1px solid #191817;background:transparent;font-size:12.5px;padding:3px 6px 3px 2px;color:#191817;cursor:pointer;\">\n      <sc-for list=\"{{ statusOptions }}\" as=\"so\" hint-placeholder-count=\"4\">\n        <option value=\"{{ so.v }}\">{{ so.label }}</option>\n      </sc-for>\n    </select>\n    <div style=\"flex:1;\"></div>\n    <label style=\"display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#6E6A63;cursor:pointer;\">\n      <input type=\"checkbox\" checked=\"{{ showHolidays }}\" onchange=\"{{ toggleHolidays }}\" style=\"accent-color:#C15757;width:14px;height:14px;cursor:pointer;\"> Holidays &amp; opportunities\n    </label>\n    <button onclick=\"{{ togglePillars }}\" style=\"{{ pillarBtnStyle }}\">Pillar mix</button>\n    <button onclick=\"{{ toggleKpis }}\" style=\"{{ kpiBtnStyle }}\">KPI goals</button>\n    <button onclick=\"{{ resetData }}\" title=\"Restore the original calendar\" style=\"background:transparent;border:none;font-size:11.5px;color:#95918A;cursor:pointer;text-decoration:underline;text-underline-offset:3px;\">Reset</button>\n  </div>\n\n  <!-- ── PILLAR PANEL (collapsible) ──────────────────── -->\n  <sc-if value=\"{{ showPillars }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:18px 26px;background:#191817;color:#F7F5F0;border-bottom:1px solid #191817;flex-shrink:0;\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px;\">\n        <span style=\"font-family:'The Seasons','Playfair Display',serif;font-size:18px;\">Pillar mix — target distribution</span>\n        <span style=\"font-size:11.5px;color:#95918A;\">Stress Adaptive Science + Proof Not Promises = science content</span>\n      </div>\n      <div style=\"display:flex;gap:26px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ pillarMonths }}\" as=\"pm\" hint-placeholder-count=\"3\">\n          <div style=\"flex:1;min-width:240px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;\">\n              <span style=\"font-size:13px;font-weight:600;letter-spacing:0.02em;\">{{ pm.label }}</span>\n              <span style=\"font-size:11.5px;color:#FFC45C;\">{{ pm.science }} science</span>\n            </div>\n            <div style=\"display:flex;height:14px;border-radius:3px;overflow:hidden;background:#2A2826;\">\n              <sc-for list=\"{{ pm.segs }}\" as=\"sg\" hint-placeholder-count=\"5\">\n                <div title=\"{{ sg.title }}\" style=\"{{ sg.style }}\"></div>\n              </sc-for>\n            </div>\n            <div style=\"margin-top:7px;font-size:10.5px;color:#95918A;line-height:1.5;\">{{ pm.note }}</div>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid #2A2826;\">\n        <sc-for list=\"{{ pillarKey }}\" as=\"pk\" hint-placeholder-count=\"5\">\n          <span style=\"display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:#C8C2B4;\"><span style=\"{{ pk.swatch }}\"></span>{{ pk.label }}</span>\n        </sc-for>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ── KPI PANEL (collapsible) ─────────────────────── -->\n  <sc-if value=\"{{ showKpis }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:18px 26px;background:#EFEAE0;border-bottom:1px solid #E1DCD0;flex-shrink:0;\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:14px;\">\n        <span style=\"font-family:'The Seasons','Playfair Display',serif;font-size:18px;\">KPI goals — launch quarter</span>\n        <span style=\"font-size:11.5px;color:#6E6A63;\">Monthly targets · actuals tracked live</span>\n      </div>\n      <div style=\"display:flex;gap:14px;flex-wrap:wrap;\">\n        <sc-for list=\"{{ kpiMonths }}\" as=\"km\" hint-placeholder-count=\"3\">\n          <div style=\"flex:1;min-width:230px;background:#fff;border:1px solid #E1DCD0;border-radius:6px;padding:15px 17px;\">\n            <div style=\"font-size:13px;font-weight:600;letter-spacing:0.02em;margin-bottom:13px;\">{{ km.label }}</div>\n            <div style=\"display:flex;gap:16px;\">\n              <div style=\"flex:1;\">\n                <div style=\"font-family:'The Seasons','Playfair Display',serif;font-size:25px;line-height:1;\">{{ km.posts }}</div>\n                <div style=\"font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:#95918A;margin-top:6px;\">Posts / wk</div>\n              </div>\n              <div style=\"flex:1;\">\n                <div style=\"font-family:'The Seasons','Playfair Display',serif;font-size:25px;line-height:1;\">{{ km.eng }}</div>\n                <div style=\"font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:#95918A;margin-top:6px;\">Engagement</div>\n              </div>\n              <div style=\"flex:1;\">\n                <div style=\"font-family:'The Seasons','Playfair Display',serif;font-size:25px;line-height:1;color:#C15757;\">{{ km.fol }}</div>\n                <div style=\"font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:#95918A;margin-top:6px;\">Follower growth</div>\n              </div>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </div>\n  </sc-if>\n\n  <!-- ── MAIN ────────────────────────────────────────── -->\n  <main class=\"xscroll\" style=\"flex:1;overflow:auto;position:relative;\">\n\n    <!-- ============ QUARTER / GANTT VIEW ============ -->\n    <sc-if value=\"{{ isQuarter }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Quarter\" style=\"padding:24px 26px 60px;\">\n      <div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:4px;\">\n        <h2 style=\"font-family:'The Seasons','Playfair Display',serif;font-size:24px;font-weight:400;margin:0;letter-spacing:-0.01em;\">The half at a glance</h2>\n        <span style=\"font-size:12px;color:#95918A;\">Campaign spans, industry events &amp; post rhythm — Jun 1 → Dec 31</span>\n      </div>\n\n      <div class=\"xscroll\" style=\"overflow-x:auto;margin-top:18px;border:1px solid #E1DCD0;border-radius:6px;background:#fff;\">\n        <div style=\"{{ gantt.wrapStyle }}\">\n          <!-- month header -->\n          <div style=\"position:relative;height:34px;border-bottom:1px solid #E1DCD0;\">\n            <sc-for list=\"{{ gantt.months }}\" as=\"mo\" hint-placeholder-count=\"3\">\n              <div style=\"{{ mo.style }}\">{{ mo.label }}</div>\n            </sc-for>\n          </div>\n          <!-- week tick row -->\n          <div style=\"position:relative;height:20px;border-bottom:1px solid #EFEAE0;\">\n            <sc-for list=\"{{ gantt.ticks }}\" as=\"tk\" hint-placeholder-count=\"13\">\n              <div style=\"{{ tk.style }}\">{{ tk.label }}</div>\n            </sc-for>\n          </div>\n\n          <!-- OBSERVANCE BARS -->\n          <div style=\"position:relative;padding:10px 0;{{ gantt.obsAreaStyle }}\">\n            <span style=\"position:absolute;left:8px;top:-9px;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#B8B2A4;background:#fff;padding:0 5px;\">Campaigns</span>\n            <sc-for list=\"{{ gantt.weekGrid }}\" as=\"wl\" hint-placeholder-count=\"13\">\n              <div style=\"{{ wl.style }}\"></div>\n            </sc-for>\n            <sc-for list=\"{{ gantt.obsBars }}\" as=\"ob\" hint-placeholder-count=\"4\">\n              <div title=\"{{ ob.title }}\" style=\"{{ ob.style }}\"><span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ ob.name }}</span></div>\n            </sc-for>\n          </div>\n\n          <!-- EVENTS LANE -->\n          <div style=\"position:relative;height:44px;border-top:1px solid #EFEAE0;\">\n            <span style=\"position:absolute;left:8px;top:3px;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#B8B2A4;\">Events</span>\n            <sc-for list=\"{{ gantt.events }}\" as=\"ev\" hint-placeholder-count=\"0\">\n              <div onclick=\"{{ ev.click }}\" title=\"{{ ev.title }}\" style=\"{{ ev.style }}\"><span style=\"{{ ev.diamond }}\"></span></div>\n            </sc-for>\n          </div>\n\n          <!-- HOLIDAY LANE -->\n          <sc-if value=\"{{ showHolidays }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position:relative;height:30px;border-top:1px solid #EFEAE0;\">\n            <span style=\"position:absolute;left:8px;top:3px;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#B8B2A4;\">Dates</span>\n            <sc-for list=\"{{ gantt.holMarks }}\" as=\"hm\" hint-placeholder-count=\"0\">\n              <div title=\"{{ hm.title }}\" style=\"{{ hm.style }}\"></div>\n            </sc-for>\n          </div>\n          </sc-if>\n\n          <!-- POSTS DENSITY LANE -->\n          <div style=\"position:relative;{{ gantt.postAreaStyle }};border-top:1px solid #E1DCD0;\">\n            <span style=\"position:absolute;left:8px;top:3px;font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:#B8B2A4;\">Posts</span>\n            <sc-for list=\"{{ gantt.postCols }}\" as=\"pc\" hint-placeholder-count=\"0\">\n              <div style=\"{{ pc.colStyle }}\">\n                <sc-for list=\"{{ pc.items }}\" as=\"it\" hint-placeholder-count=\"0\">\n                  <div onclick=\"{{ it.click }}\" title=\"{{ it.title }}\" style=\"{{ it.style }}\"></div>\n                </sc-for>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n      </div>\n\n      <!-- event index -->\n      <div style=\"margin-top:22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;\">\n        <sc-for list=\"{{ gantt.eventList }}\" as=\"el\" hint-placeholder-count=\"0\">\n          <div onclick=\"{{ el.click }}\" style=\"display:flex;gap:11px;padding:12px 14px;background:#fff;border:1px solid #E1DCD0;border-radius:5px;cursor:pointer;align-items:flex-start;\" style-hover=\"border-color:#191817;\">\n            <div style=\"flex-shrink:0;text-align:center;min-width:38px;\">\n              <div style=\"font-family:'The Seasons','Playfair Display',serif;font-size:19px;line-height:1;\">{{ el.day }}</div>\n              <div style=\"font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:#95918A;margin-top:2px;\">{{ el.mon }}</div>\n            </div>\n            <div style=\"min-width:0;\">\n              <div style=\"font-size:12.5px;font-weight:500;line-height:1.3;\">{{ el.name }}</div>\n              <div style=\"font-size:11px;color:#6E6A63;margin-top:2px;line-height:1.4;\">{{ el.sub }}</div>\n            </div>\n          </div>\n        </sc-for>\n      </div>\n    </section>\n    </sc-if>\n\n    <!-- ============ MONTH GRID VIEW ============ -->\n    <sc-if value=\"{{ isMonth }}\" hint-placeholder-val=\"{{ true }}\">\n    <section data-screen-label=\"Month\" style=\"padding:22px 26px 60px;display:flex;flex-direction:column;gap:34px;\">\n      <sc-for list=\"{{ monthGrids }}\" as=\"mg\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:12px;\">\n            <h2 style=\"font-family:'The Seasons','Playfair Display',serif;font-size:26px;font-weight:400;margin:0;letter-spacing:-0.01em;\">{{ mg.label }}</h2>\n            <span style=\"font-size:12px;color:#95918A;\">{{ mg.sub }}</span>\n          </div>\n          <!-- observance ribbons -->\n          <sc-if value=\"{{ mg.hasObs }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:4px;margin-bottom:8px;\">\n            <sc-for list=\"{{ mg.observances }}\" as=\"ob\" hint-placeholder-count=\"0\">\n              <div title=\"{{ ob.title }}\" style=\"{{ ob.style }}\"><span style=\"{{ ob.dot }}\"></span>{{ ob.name }}<span style=\"margin-left:auto;font-size:10.5px;color:#6E6A63;font-weight:400;\">{{ ob.range }}</span></div>\n            </sc-for>\n          </div>\n          </sc-if>\n          <!-- weekday header -->\n          <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px;\">\n            <sc-for list=\"{{ weekdayNames }}\" as=\"wd\" hint-placeholder-count=\"7\">\n              <div style=\"font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#95918A;font-weight:500;text-align:center;\">{{ wd }}</div>\n            </sc-for>\n          </div>\n          <!-- weeks -->\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <sc-for list=\"{{ mg.weeks }}\" as=\"wk\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:repeat(7,1fr);gap:6px;\">\n                <sc-for list=\"{{ wk.cells }}\" as=\"cell\" hint-placeholder-count=\"7\">\n                  <div class=\"{{ cell.cls }}\" onclick=\"{{ cell.click }}\" ondrop=\"{{ cell.drop }}\" ondragover=\"{{ cell.over }}\" ondragleave=\"{{ cell.leave }}\" style=\"{{ cell.style }}\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;min-height:18px;\">\n                      <span style=\"{{ cell.numStyle }}\">{{ cell.dayNum }}</span>\n                      <sc-if value=\"{{ cell.inMonth }}\" hint-placeholder-val=\"{{ true }}\">\n                        <button onclick=\"{{ cell.add }}\" title=\"Add a post\" style=\"opacity:0.0;width:18px;height:18px;line-height:1;border:none;background:#EFEAE0;border-radius:3px;color:#191817;font-size:13px;cursor:pointer;transition:opacity .2s;\" class=\"addbtn\">+</button>\n                      </sc-if>\n                    </div>\n                    <sc-for list=\"{{ cell.hols }}\" as=\"h\" hint-placeholder-count=\"0\">\n                      <div title=\"{{ h.n }}\" style=\"{{ h.style }}\">{{ h.n }}</div>\n                    </sc-for>\n                    <div style=\"display:flex;flex-direction:column;gap:3px;margin-top:3px;\">\n                      <sc-for list=\"{{ cell.posts }}\" as=\"post\" hint-placeholder-count=\"0\">\n                        <div draggable=\"true\" onclick=\"{{ post.click }}\" ondragstart=\"{{ post.drag }}\" ondragend=\"{{ post.dragEnd }}\" title=\"{{ post.title }}\" style=\"{{ post.chipStyle }}\">\n                          <span style=\"{{ post.dotStyle }}\"></span>\n                          <span style=\"overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;\">{{ post.label }}</span>\n                          <sc-if value=\"{{ post.flagged }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"{{ post.flagStyle }}\">{{ post.flags }}</span></sc-if>\n                        </div>\n                      </sc-for>\n                    </div>\n                  </div>\n                </sc-for>\n              </div>\n            </sc-for>\n          </div>\n        </div>\n      </sc-for>\n    </section>\n    </sc-if>\n\n    <!-- ============ WEEK AGENDA VIEW ============ -->\n    <sc-if value=\"{{ isWeek }}\" hint-placeholder-val=\"{{ false }}\">\n    <section data-screen-label=\"Week\" style=\"padding:22px 26px 60px;display:flex;flex-direction:column;gap:18px;max-width:980px;\">\n      <sc-for list=\"{{ weekList }}\" as=\"wk\" hint-placeholder-count=\"6\">\n        <div style=\"border:1px solid #E1DCD0;border-radius:6px;background:#fff;overflow:hidden;\">\n          <div style=\"display:flex;align-items:center;gap:14px;padding:13px 18px;background:#EFEAE0;border-bottom:1px solid #E1DCD0;\">\n            <span style=\"font-family:'The Seasons','Playfair Display',serif;font-size:18px;\">{{ wk.range }}</span>\n            <span style=\"font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">{{ wk.count }}</span>\n            <sc-for list=\"{{ wk.tags }}\" as=\"tg\" hint-placeholder-count=\"0\">\n              <span style=\"{{ tg.style }}\">{{ tg.label }}</span>\n            </sc-for>\n            <div style=\"flex:1;\"></div>\n            <button onclick=\"{{ wk.add }}\" style=\"font-size:11.5px;color:#191817;background:transparent;border:1px solid #C8C2B4;border-radius:4px;padding:5px 11px;cursor:pointer;\" style-hover=\"border-color:#191817;\">+ Add</button>\n          </div>\n          <div style=\"padding:6px 18px;\">\n            <sc-for list=\"{{ wk.days }}\" as=\"day\" hint-placeholder-count=\"0\">\n or:pointer;\"> Event support</label>\n            </div>\n          </sc-if>\n\n          <sc-if value=\"{{ modalIsLi }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;gap:14px;\">\n              <label style=\"flex:1;display:flex;flex-direction:column;gap:5px;\">\n                <span style=\"font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">Week theme</span>\n                <input type=\"text\" value=\"{{ form.theme }}\" oninput=\"{{ setField.theme }}\" placeholder=\"e.g. Science Authority\" style=\"border:none;border-bottom:1px solid #191817;background:transparent;padding:6px 2px;font-size:14px;\">\n              </label>\n              <label style=\"flex:1;display:flex;flex-direction:column;gap:5px;\">\n                <span style=\"font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">LinkedIn format</span>\n                <input type=\"text\" value=\"{{ form.liType }}\" oninput=\"{{ setField.liType }}\" placeholder=\"e.g. Thought Leadership\" style=\"border:none;border-bottom:1px solid #191817;background:transparent;padding:6px 2px;font-size:14px;\">\n              </label>\n            </div>\n            <label style=\"display:flex;flex-direction:column;gap:5px;\">\n              <span style=\"font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">Post hook</span>\n              <textarea value=\"{{ form.hook }}\" oninput=\"{{ setField.hook }}\" rows=\"2\" placeholder=\"The opening line that stops the scroll…\" style=\"border:1px solid #C8C2B4;border-radius:4px;background:#fff;padding:9px 11px;font-size:13.5px;line-height:1.5;resize:vertical;\"></textarea>\n            </label>\n            <label style=\"display:flex;flex-direction:column;gap:5px;\">\n              <span style=\"font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">Body direction</span>\n              <textarea value=\"{{ form.body }}\" oninput=\"{{ setField.body }}\" rows=\"4\" placeholder=\"What the post should cover…\" style=\"border:1px solid #C8C2B4;border-radius:4px;background:#fff;padding:9px 11px;font-size:13.5px;line-height:1.5;resize:vertical;\"></textarea>\n            </label>\n            <div style=\"display:flex;gap:14px;\">\n              <label style=\"flex:1;display:flex;flex-direction:column;gap:5px;\">\n                <span style=\"font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">Call to action</span>\n                <input type=\"text\" value=\"{{ form.cta }}\" oninput=\"{{ setField.cta }}\" placeholder=\"e.g. Follow for weekly scalp science.\" style=\"border:none;border-bottom:1px solid #191817;background:transparent;padding:6px 2px;font-size:14px;\">\n              </label>\n              <label style=\"flex:1;display:flex;flex-direction:column;gap:5px;\">\n                <span style=\"font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">Owner</span>\n                <input type=\"text\" value=\"{{ form.owner }}\" oninput=\"{{ setField.owner }}\" placeholder=\"e.g. Samira → Jose\" style=\"border:none;border-bottom:1px solid #191817;background:transparent;padding:6px 2px;font-size:14px;\">\n              </label>\n            </div>\n            <label style=\"display:flex;flex-direction:column;gap:5px;\">\n              <span style=\"font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;color:#95918A;\">Tie-in / context</span>\n              <textarea value=\"{{ form.tie }}\" oninput=\"{{ setField.tie }}\" rows=\"2\" placeholder=\"Why this post, this week…\" style=\"border:1px solid #C8C2B4;border-radius:4px;background:#fff;padding:9px 11px;font-size:13.5px;line-height:1.5;resize:vertical;\"></textarea>\n            </label>\n          </sc-if>\n        </div>\n        <div style=\"display:flex;align-items:center;gap:12px;padding:16px 24px;border-top:1px solid #E1DCD0;\">\n          <sc-if value=\"{{ canDelete }}
